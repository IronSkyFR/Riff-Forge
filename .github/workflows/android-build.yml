name: Build Riff Forge Heritage 2.4.2 APK
on:
  workflow_dispatch:
  push:
    branches: [ main, 'work/**' ]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Node tests
        run: node --test tests/*.test.js
      # The runner image already ships the Android SDK with recent cmdline-tools;
      # android-actions/setup-android@v3 downloaded an older sdkmanager that failed.
      - name: SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: riff-forge-heritage-242-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
